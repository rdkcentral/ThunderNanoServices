name: Build ThunderNanoServices on Linux

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches: ["master", "R*"]
  pull_request:
    branches: ["master", "R*"]

jobs:
  Thunder:
    uses: rdkcentral/Thunder/.github/workflows/Linux build template.yml@master

  ThunderInterfaces:
    needs: Thunder
    uses: rdkcentral/ThunderInterfaces/.github/workflows/Linux build template.yml@master

  ThunderNanoServices:
    needs: ThunderInterfaces
    uses: ./.github/workflows/Linux build template.yml
    with:
      source-repository: ${{ github.repository }}
